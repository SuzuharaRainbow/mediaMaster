server {
  listen 80;
  server_name suzuhara-nozomi.love;

  client_max_body_size 0;

  # Some webhook validators may probe over plain HTTP even when URL is HTTPS.
  location = /line/webhook {
    proxy_pass http://host.docker.internal:28789/line/webhook;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Line-Signature $http_x_line_signature;
    proxy_pass_request_headers on;
    proxy_buffering off;
    proxy_redirect off;
  }

  # Chatgen paths intentionally disabled at the edge.
  location = /chatgen { return 404; }
  location ^~ /chatgen/ { return 404; }
  location ^~ /chatgen-api/ { return 404; }
  location = /styles.css { return 404; }
  location = /main.js { return 404; }
  location ^~ /generated-images/ { return 404; }
  location ^~ /viewdistance-outputs/ { return 404; }
  location ^~ /seva-outputs/ { return 404; }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name suzuhara-nozomi.love;

  ssl_certificate /etc/letsencrypt/live/suzuhara-nozomi.love/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/suzuhara-nozomi.love/privkey.pem;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 0;

  # Chatgen paths intentionally disabled at the edge.
  location = /chatgen { return 404; }
  location ^~ /chatgen/ { return 404; }
  location ^~ /chatgen-api/ { return 404; }
  location = /styles.css { return 404; }
  location = /main.js { return 404; }
  location ^~ /generated-images/ { return 404; }
  location ^~ /viewdistance-outputs/ { return 404; }
  location ^~ /seva-outputs/ { return 404; }

  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_pass_request_headers on;
    proxy_buffering off;
    proxy_redirect off;
  }

  location /media/ {
    proxy_pass http://api:8000/media/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_pass_request_headers on;
    proxy_buffering off;
    proxy_redirect off;
  }

  # LINE webhook -> OpenClaw gateway tunnel on host.
  location = /line/webhook {
    proxy_pass http://host.docker.internal:28789/line/webhook;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Line-Signature $http_x_line_signature;
    proxy_pass_request_headers on;
    proxy_buffering off;
    proxy_redirect off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}